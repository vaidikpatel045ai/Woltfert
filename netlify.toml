# Netlify deployment. Next.js runs through Netlify's official runtime
# (@netlify/plugin-nextjs), which handles the App Router, API routes,
# next/image and the generated OG image.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NEXT_TELEMETRY_DISABLED = "1"

[[plugins]]
  package = "@netlify/plugin-nextjs"
